# Gradle 守护进程的 JVM 参数：给足堆内存，否则处理 AndroidX 与 AAPT2 时容易 OOM。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 开启并行执行：本工程只有一个模块，收益有限，但能让依赖解析与任务调度更紧凑。
org.gradle.parallel=true
# 开启构建缓存：重复构建（如先 debug 再 release）时可以复用已生成的中间产物，显著提速。
org.gradle.caching=true
# 使用 AndroidX 而非旧的 support 库，这是 AGP 8.x 的硬性要求。
android.useAndroidX=true
# 让 R 类只包含本模块资源（非传递依赖），可以减小 R 类体积并加快编译。
android.nonTransitiveRClass=true
# 关闭 Jetifier：本工程不依赖任何旧 support 库，开启只会浪费时间。
android.enableJetifier=false
